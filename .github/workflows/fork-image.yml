name: Fork Image

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ghcr
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/johagan94/lidarr:latest
            ghcr.io/johagan94/lidarr:develop
            ghcr.io/johagan94/lidarr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
